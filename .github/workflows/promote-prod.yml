name: Promote to production

# Production is never automatic. Staging gets every push to main; prod is a
# deliberate promotion of a proven build. Trigger one of two ways:
#
#   • Cut a release tag (from main):
#       git tag v1.2.0 && git push origin v1.2.0
#   • Or the "Run workflow" button (Actions → Promote to production),
#     typing "deploy" to confirm.
#
# Deploys BOTH services from the chosen commit so production is always a
# coherent api+web pair. The commit's tests already ran when it merged to
# main, so this workflow is deploy-only.
#
# For a stronger gate, add `environment: production` (with required
# reviewers, configured in Settings → Environments) to the deploy jobs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a PRODUCTION deploy'
        required: true
        default: ''

jobs:
  # Tag pushes promote unconditionally; manual runs must type "deploy".
  # If this is skipped, both deploy jobs (which need it) skip too.
  guard:
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Promoting ${{ github.ref_name }} to production (api + web)."

  deploy-api:
    needs: [guard]
    runs-on: ubuntu-latest
    concurrency:
      group: api-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API to production
        run: flyctl deploy --remote-only
        working-directory: packages/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    needs: [guard]
    runs-on: ubuntu-latest
    concurrency:
      group: web-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy Web to production
        run: flyctl deploy --remote-only
        working-directory: packages/web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
