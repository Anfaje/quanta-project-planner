# ─────────────────────────────────────────────────────────────
# Quanta API — Fly app configuration
#
# Deploy from packages/api/ via:
#   fly deploy --config fly.toml --dockerfile Dockerfile
# or just:
#   cd packages/api && fly deploy
#
# Before the first deploy:
#   fly apps create quanta-api
#   fly mpg create --name quanta-db --region ord     # Managed Postgres (MPG)
#   fly mpg attach quanta-db --app quanta-api         # auto-sets DATABASE_URL
#     The attached URL points at MPG's PgBouncer pooler (Session mode by
#     default). Prisma works against it as-is — no ?pgbouncer=true needed
#     unless you switch the pooler to Transaction mode, which disables named
#     prepared statements. See DEPLOY.md for the full connection notes.
#   fly redis create --name quanta-redis --region ord
#     (copy the printed REDIS_URL into fly secrets below)
#   fly secrets set --app quanta-api \
#     SESSION_SECRET="$(openssl rand -hex 32)" \
#     TOTP_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     REDIS_URL="<from fly redis create>" \
#     WEB_URL="https://quanta-web.fly.dev"
# ─────────────────────────────────────────────────────────────

app           = "quanta-api"
primary_region = "ord"  # Chicago — matches the user's location

# Drop "kill_signal" defaults; tini in the image handles SIGTERM.

# Run prisma migrations against the attached Postgres before the new
# image goes live. If migrations fail the deploy is aborted and the
# previous version keeps serving — Fly's standard release-command
# semantics.
[deploy]
  # NOTE: We use 'prisma db push' rather than 'prisma migrate deploy'
  # because the project doesn't yet have a migrations/ folder. db push
  # syncs the schema directly from schema.prisma without creating a
  # migration history — fine for e2e testing on Fly, but should be
  # replaced with proper migrations BEFORE any production data exists.
  #
  # Migration path when you're ready:
  #   1. Locally: cd packages/api && npx prisma migrate dev --name init
  #   2. Commit packages/api/prisma/migrations/
  #   3. Change this line to: npx prisma migrate deploy
  #   4. Push; the next deploy applies migrations properly with audit trail
  #
  # --skip-generate: the client was generated in the Dockerfile builder
  # --accept-data-loss: required when db push detects destructive changes;
  #   the warning is for awareness — we don't have prod data yet so empty
  release_command = "sh -c 'npx prisma db push --skip-generate --accept-data-loss && npx prisma db execute --schema prisma/schema.prisma --file prisma/backfill_business_unit.sql'"
  strategy        = "rolling"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  API_PORT = "4000"
  # TEMPORARY: two-factor auth is disabled while we test core functionality.
  # Re-enable by setting this to "true" or removing the line. Tracked in
  # GitHub issue #1 "Re-enable MFA on signup, login, and invite acceptance".
  MFA_ENABLED = "false"
  # WEB_URL is intentionally not set here — it's a secret so it can be
  # rotated without re-deploying code. Set it via `fly secrets set`.

[http_service]
  internal_port      = 4000
  force_https        = true
  auto_stop_machines = false  # keep both machines warm; flip to true to scale to zero when idle
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

  # Fly's health checker hits /api/health on the http_service port.
  # createApp's /api/health probes Postgres with SELECT 1 — retried once so a
  # PgBouncer-recycled idle connection doesn't flap the check — and reports
  # Redis status, returning 503 only if the DB is truly unreachable so Fly
  # keeps the previous machine serving during a failed deploy.
  [[http_service.checks]]
    grace_period  = "30s"
    interval      = "15s"
    method        = "GET"
    timeout       = "5s"
    path          = "/api/health"

# Shared-1x is the cheapest tier and plenty for testing.
[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
